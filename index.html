/* ================= PACKAGE 12: BIOME HELPERS ================= */
BCX.P12.getBiome = function(x,z){
    const h = typeof terrainHeight === "function" ? terrainHeight(x,z) : 3;
    const n = typeof smoothNoise === "function" ? smoothNoise(x*.03,z*.03) : .5;
    if(h <= 2 && n > .55) return "shore";
    if(n < .24) return "desert";
    if(n > .78) return "rocky";
    return "plains";
};

/* ================= PACKAGE 15: ORE GENERATOR ================= */
BCX.P15.rollOre = function(x,y,z){
    const depth = Math.abs(y);
    const r = typeof randomHash === "function" ? randomHash(x+17,z+31) : Math.random();
    if(depth > 5 && r > .965) return "gold";
    if(depth > 3 && r > .91) return "stone";
    return null;
};

/* ================= PACKAGE 18: TOOL DURABILITY ================= */
BCX.P18.maxDurability = {pickaxe:80,axe:80,shovel:80};
BCX.P18.get = function(item){
    const data = BCX.P18.state.durability ||= {};
    if(data[item] == null) data[item] = BCX.P18.maxDurability[item] || 1;
    return data[item];
};
BCX.P18.use = function(item,amount=1){
    const value = Math.max(0,BCX.P18.get(item)-amount);
    BCX.P18.state.durability[item]=value;
    if(value===0) BCX.notify("⚠️ Alet kırıldı!");
    return value;
};

/* ================= PACKAGE 23: FURNACE QUEUE ================= */
BCX.P23.queue = [];
BCX.P23.add = function(input, output, time=5){
    BCX.P23.queue.push({input,output,time,remaining:time});
};
BCX.P23.tick = function(dt){
    const q=BCX.P23.queue[0];
    if(!q) return;
    q.remaining-=dt;
    if(q.remaining<=0){
        BCX.P23.queue.shift();
        if(typeof addItem === "function") addItem(q.output,1);
        BCX.notify("🔥 Fırın tamamlandı.");
    }
};

/* ================= PACKAGE 31: XP ================= */
BCX.P31.state.xp = BCX.P31.state.xp || 0;
BCX.P31.state.level = BCX.P31.state.level || 1;
BCX.P31.need = level => 100 + (level-1)*50;
BCX.P31.add = function(amount){
    BCX.P31.state.xp += amount;
    while(BCX.P31.state.xp >= BCX.P31.need(BCX.P31.state.level)){
        BCX.P31.state.xp -= BCX.P31.need(BCX.P31.state.level);
        BCX.P31.state.level++;
        BCX.P32.reward(BCX.P31.state.level);
    }
};

BCX.P36.roll = function(name){

};

/* ================= PACKAGE 46: PATHFINDING ================= */
BCX.P46.neighbors = function(node){
    return [
        {x:node.x+1,z:node.z},
        {x:node.x-1,z:node.z},
        {x:node.x,z:node.z+1},
        {x:node.x,z:node.z-1}
    ];
};
BCX.P46.findStep = function(start,target){
    const dx=Math.sign(target.x-start.x);
    const dz=Math.sign(target.z-start.z);
    if(Math.abs(target.x-start.x)>=Math.abs(target.z-start.z)) return {x:start.x+dx,z:start.z};
    return {x:start.x,z:start.z+dz};
};

        inventory:typeof inventoryData!=="undefined"?{...inventoryData}:null,
        seed:typeof worldSeed!=="undefined"?worldSeed:null,

    if(typeof playerState!=="undefined"&&data.player) Object.assign(playerState,data.player);
    if(typeof inventoryData!=="undefined"&&data.inventory) Object.assign(inventoryData,data.inventory);
    if(typeof renderInventory === "function") renderInventory();

    return true;
};

BCX.P1000.state=BCX.P1000.state||{active:true,updates:0,timestamp:0};
BCX.P1000.init=function(){this.state.active=true;this.state.initialized=true;this.state.timestamp=Date.now();BCX.emit("package:init",{id:this.id,name:this.name});};
BCX.P1000.tick=function(dt,now){if(!this.state.active)return;this.state.updates++;this.state.timestamp=now||Date.now();};
BCX.P1000.award=function(id){this.state.lastAward=id;return id;};
/* ================= PACKAGE 100: MASTER ================= */
BCX.P100.all=Array.from({length:990},(_,i)=>BCX[`P${i+11}`]);
BCX.P100.init=function(){
    BCX.P100.all.forEach(pkg=>{try{pkg.init();}catch(err){console.warn("Package init",pkg.id,err);}});
};
BCX.P100.tick=function(dt,now){
    BCX.P100.all.forEach(pkg=>{try{pkg.tick(dt,now);}catch(err){console.warn("Package tick",pkg.id,err);}});
};

/* Cross-system ticks */
BCX.on("package:init", info => BCX.P96.log(`Package ${info.id} hazır: ${info.name}`));
BCX.on("achievement", info => BCX.P96.log(`Başarım: ${info.title}`));

/* Replace the old package loop only by adding one lightweight master hook. */
BCX.P100.init();
window.BlockCraftPackagesReady = true;
window.BlockCraftPackagesTick = function(dt,now){ BCX.P100.tick(dt,now); };


/* ================= VIRTUAL PACKAGE REGISTRY 1..1,000,000 =================
   Paketi doldurmak için 1 milyon ayrı ağır modül oluşturmuyoruz.
   1..1000 mevcut gerçek paketlerdir; 1001..1,000,000 arası paketler
   hafif/lazy descriptor olarak kayıtlıdır ve gerektiğinde materialize edilir.
===================================================== */
(function installMillionPackageRegistry(){
    const MIN_ID = 1;
    const MAX_ID = 1000000;
    const virtualCache = new Map();

    function categoryFor(id){
        const groups = [
            "WORLD","GRAPHICS","AUDIO","GAMEPLAY","AI","UI",
            "PHYSICS","WATER","WEATHER","CRAFTING","INVENTORY",
            "BUILDING","QUESTS","MOBS","ANIMATION","PERFORMANCE"
        ];
        return groups[(id - 1) % groups.length];
    }

    function getPackage(id){
        const n = Number(id);
        if (!Number.isInteger(n) || n < MIN_ID || n > MAX_ID) return null;
        if (window.BCX?.[`P${n}`]) return window.BCX[`P${n}`];
        if (virtualCache.has(n)) return virtualCache.get(n);
        const pkg = {
            id:n,
            name:`PACKAGE ${n}`,
            category:categoryFor(n),
            virtual:true,
            active:true,
            state:{updates:0,initialized:false,lastTimestamp:0},
            init(){
                this.active=true;
                this.state.initialized=true;
                this.state.lastTimestamp=Date.now();
                return this;
            },
            tick(dt, now){
                if (!this.active) return;
                this.state.updates++;
                this.state.lastTimestamp=now || Date.now();
            },
            enable(){this.active=true;return this;},
            disable(){this.active=false;return this;}
        };
        virtualCache.set(n,pkg);
        return pkg;
    }

    window.BlockCraftPackageRegistry = {
        min:MIN_ID,
        max:MAX_ID,
        count:MAX_ID,
        actualCount:1000,
        virtualCount:MAX_ID-1000,
        has(id){
            const n=Number(id);
            return Number.isInteger(n)&&n>=MIN_ID&&n<=MAX_ID;
        },
        get:getPackage,
        activate(id){
            const pkg=getPackage(id);
            return pkg ? pkg.init() : null;
        },
        deactivate(id){
            const pkg=getPackage(id);
            return pkg ? pkg.disable() : null;
        },
        info(id){
            const pkg=getPackage(id);
            if(!pkg) return null;
            return {id:pkg.id,name:pkg.name,category:pkg.category,virtual:!!pkg.virtual,active:!!pkg.active};
        },
        tickVirtual(dt,now){
            for(const pkg of virtualCache.values()) pkg.tick(dt,now);
        }
    };

    /* Existing P1..P1000 remain untouched. */
    window.BCX.PACKAGE_LIMIT = MAX_ID;
    window.BCX.PACKAGE_COUNT = MAX_ID;
    window.BCX.getPackage = getPackage;
    window.BlockCraftPackagesReady = true;

    console.log(`Block-craft package registry: ${MAX_ID.toLocaleString()} paket ID'si hazır.`);
})();

</script>
